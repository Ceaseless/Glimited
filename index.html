<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G Limited Route Schedule</title>
  <link rel="stylesheet" href="styles.css">
  
</head>

<body>

  <h1>G Limited Route Schedule</h1>

  <div class="current">
    <div>Currently active:</div>
    <strong id="active-quest">Active Quest Here</strong>
  </div>

  <table>
    <thead>
      <tr>
        <th id="th-left">Date</th>
        <th>Start Time<br>(00:00 JST)</th>
        <th id="th-right">Quest</th>
      </tr>
    </thead>

    <tbody id="schedule">
    </tbody>
  </table>

  <script src="scripts/schedule.js"></script>


</body>
</html>
